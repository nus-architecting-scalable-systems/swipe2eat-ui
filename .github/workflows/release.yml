name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for the release (for example, 1.2.3)
        required: true
        type: string
      target_platforms:
        description: Platforms to release
        required: true
        default: all
        type: choice
        options:
          - all
          - mobile
          - android
      release_notes:
        description: Optional release notes body
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  deploy-android:
    name: deploy-android
    if: ${{ inputs.target_platforms == 'all' || inputs.target_platforms == 'mobile' || inputs.target_platforms == 'android' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh prod "$RUNNER_TEMP/dart-defines.json"
        env:
          DART_DEFINES_JSON_BASE64: ${{ secrets.PROD_DART_DEFINES_JSON_BASE64 }}
      - run: printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: printf '%s' "${FIREBASE_APPDISTRO_SERVICE_ACCOUNT_JSON_BASE64}" | base64 --decode > "$RUNNER_TEMP/firebase-appdist.json"
        env:
          FIREBASE_APPDISTRO_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_APPDISTRO_SERVICE_ACCOUNT_JSON_BASE64 }}
      - run: npm install -g firebase-tools
      - name: Build production APK
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if flutter build apk --release --flavor prod --dart-define-from-file="$RUNNER_TEMP/dart-defines.json" --build-name="${{ inputs.version }}" --build-number="${{ github.run_number }}"; then
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "Production APK build failed after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Production APK build failed on attempt ${attempt}; retrying after a short delay..." >&2
            sleep 20
          done
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Distribute production APK to Firebase App Distribution
        run: |
          set -euo pipefail

          if [[ -z "${FIREBASE_ANDROID_APP_ID_PROD:-}" ]]; then
            echo "Set FIREBASE_ANDROID_APP_ID_PROD as a production environment variable." >&2
            exit 1
          fi

          if [[ -z "${FIREBASE_APPDISTRO_TESTERS:-}" ]]; then
            echo "Set FIREBASE_APPDISTRO_TESTERS as comma-separated tester emails." >&2
            exit 1
          fi

          release_notes="${RELEASE_NOTES:-}"
          if [[ -z "$release_notes" ]]; then
            release_notes="Manual Android release v${APP_VERSION} from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          fi

          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-prod-release.apk \
            --app "${FIREBASE_ANDROID_APP_ID_PROD}" \
            --testers "${FIREBASE_APPDISTRO_TESTERS}" \
            --release-notes "$release_notes" \
            2>&1 | tee "$RUNNER_TEMP/firebase-appdist.log"

          console_uri=$(sed -n 's/.*firebase_console_uri:[[:space:]]*//p' "$RUNNER_TEMP/firebase-appdist.log" | tail -n 1)
          testing_uri=$(sed -n 's/.*testing_uri:[[:space:]]*//p' "$RUNNER_TEMP/firebase-appdist.log" | tail -n 1)
          binary_uri=$(sed -n 's/.*binary_download_uri:[[:space:]]*//p' "$RUNNER_TEMP/firebase-appdist.log" | tail -n 1)

          {
            echo "### Android Production Distribution"
            echo
            echo "- Package: \`edu.nus.swipe2eat\`"
            echo "- Artifact: \`app-prod-release.apk\`"
            echo "- Version: \`v${APP_VERSION}+${BUILD_NUMBER}\`"
            if [[ -n "$console_uri" ]]; then
              echo "- Firebase console: $console_uri"
            fi
            if [[ -n "$testing_uri" ]]; then
              echo "- Tester install page: $testing_uri"
            fi
            if [[ -n "$binary_uri" ]]; then
              echo "- Direct download link: $binary_uri"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          FIREBASE_ANDROID_APP_ID_PROD: ${{ vars.FIREBASE_ANDROID_APP_ID_PROD }}
          FIREBASE_APPDISTRO_TESTERS: ${{ vars.FIREBASE_APPDISTRO_TESTERS }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-appdist.json
          RELEASE_NOTES: ${{ inputs.release_notes }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-android-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error
          retention-days: 30

  deploy-ios:
    name: deploy-ios-disabled
    if: ${{ false }}
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: pod install
        working-directory: ios
      - run: bash .github/scripts/materialize_dart_defines.sh prod "$RUNNER_TEMP/dart-defines.json"
        env:
          DART_DEFINES_JSON_BASE64: ${{ secrets.PROD_DART_DEFINES_JSON_BASE64 }}
      - run: bundle exec fastlane ios production
        env:
          DART_DEFINES_FILE: ${{ runner.temp }}/dart-defines.json
          IOS_SCHEME: prod
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-ios-ipa
          path: build/ios/ipa/prod.ipa
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: github-release
    needs:
      - deploy-android
      - deploy-ios
    if: ${{ always() && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p dist
      - uses: actions/download-artifact@v7
        with:
          path: dist/artifacts
      - name: Prepare GitHub release assets
        run: |
          set -euo pipefail

          # GitHub release assets are flat. Keep single-file artifacts such as APKs
          # as direct assets, and zip any multi-file artifacts.
          mkdir -p dist/release-assets
          find dist/artifacts -mindepth 1 -maxdepth 1 -type d | sort | while read -r artifact_dir; do
            artifact_name=$(basename "$artifact_dir")
            file_count=$(find "$artifact_dir" -type f | wc -l | tr -d ' ')

            if [[ "$file_count" == "1" ]]; then
              source_file=$(find "$artifact_dir" -type f | head -n 1)
              asset_name=$(basename "$source_file")
              if [[ -e "dist/release-assets/$asset_name" ]]; then
                asset_name="${artifact_name}-${asset_name}"
              fi
              cp "$source_file" "dist/release-assets/$asset_name"
            else
              (cd "$artifact_dir" && zip -qr "../../release-assets/${artifact_name}.zip" .)
            fi
          done

          find dist/release-assets -maxdepth 1 -type f | sort
      - uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          files: |
            dist/release-assets/*
