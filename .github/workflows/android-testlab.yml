name: Android Firebase Test Lab

on:
  workflow_run:
    workflows: [Main Validation]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: android-testlab-${{ github.event.workflow_run.head_sha || github.sha }}
  # Do not abandon a remote matrix after submission.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-testlab:
    name: android-testlab (report only)
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    environment: test-lab
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      - name: Validate dedicated Test Lab credential
        env:
          FIREBASE_TEST_LAB_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID }}
          FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_TEST_LAB_PROJECT_ID" ]]; then
            echo "Set FIREBASE_TEST_LAB_PROJECT_ID in the test-lab environment." >&2
            exit 1
          fi
          if [[ -z "$FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON_BASE64" ]]; then
            echo "Set FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON_BASE64 in the test-lab environment." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON_BASE64" |
            base64 --decode > "$RUNNER_TEMP/firebase-test-lab.json"
          python3 - "$RUNNER_TEMP/firebase-test-lab.json" "$FIREBASE_TEST_LAB_PROJECT_ID" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as key_file:
              key = json.load(key_file)
          if key.get("type") != "service_account":
              raise SystemExit("Test Lab credential must be a service-account JSON key.")
          if key.get("project_id") != sys.argv[2]:
              raise SystemExit("Service-account project_id does not match FIREBASE_TEST_LAB_PROJECT_ID.")
          if not key.get("client_email") or not key.get("private_key"):
              raise SystemExit("Service-account JSON is missing client_email or private_key.")
          PY

      - name: Authenticate to dedicated Firebase project
        env:
          FIREBASE_TEST_LAB_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-test-lab.json"
          gcloud config set project "$FIREBASE_TEST_LAB_PROJECT_ID"
          gcloud auth print-access-token >/dev/null

      - name: Require virtual MediumPhone.arm on API 35
        env:
          FIREBASE_TEST_LAB_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud firebase test android models describe MediumPhone.arm --project="$FIREBASE_TEST_LAB_PROJECT_ID" --format=json > "$RUNNER_TEMP/testlab-model.json"
          python3 - "$RUNNER_TEMP/testlab-model.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as model_file:
              model = json.load(model_file)
          form = str(model.get("form", "")).upper()
          versions = [str(v) for v in model.get("supportedVersionIds", [])]
          if form != "VIRTUAL" or "35" not in versions:
              raise SystemExit(
                  "Test Lab configuration error: MediumPhone.arm must be virtual "
                  f"and support API 35 (form={form!r}, versions={versions!r})."
              )
          PY

      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"

      - name: Build dev app and instrumentation APKs
        run: |
          set -euo pipefail
          flutter build apk --debug --flavor dev --target integration_test/app_smoke_test.dart --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
          (cd android && ./gradlew app:assembleDevDebugAndroidTest -Ptarget=integration_test/app_smoke_test.dart)

      - name: Verify Test Lab APKs contain a discoverable test
        run: |
          set -euo pipefail
          app_apk=build/app/outputs/flutter-apk/app-dev-debug.apk
          test_apk=build/app/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
          test -s "$app_apk"
          test -s "$test_apk"
          found_test=false
          while IFS= read -r dex_file; do
            if unzip -p "$test_apk" "$dex_file" | strings | grep -F 'Ledu/nus/swipe2eat/MainActivityTest;' >/dev/null; then
              found_test=true
              break
            fi
          done < <(unzip -Z1 "$test_apk" | grep -E '^classes[0-9]*\.dex$')
          if [[ "$found_test" != true ]]; then
            echo "Instrumentation APK does not contain MainActivityTest." >&2
            exit 1
          fi

      - name: Run and report Firebase Test Lab matrix
        env:
          FIREBASE_TEST_LAB_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID }}
          TESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p testlab-results
          set +e
          gcloud firebase test android run --project="$FIREBASE_TEST_LAB_PROJECT_ID" --type=instrumentation --app=build/app/outputs/flutter-apk/app-dev-debug.apk --test=build/app/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk --device=model=MediumPhone.arm,version=35,locale=en,orientation=portrait --timeout=5m --results-history-name=swipe2eat-android-smoke --client-details="matrixLabel=swipe2eat-smoke-${GITHUB_RUN_ID}" 2>&1 | tee testlab-results/testlab.log
          testlab_status=${PIPESTATUS[0]}
          set -e
          export TESTLAB_STATUS="$testlab_status"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          log = Path("testlab-results/testlab.log").read_text(errors="replace")
          urls = re.findall(r"https://console\.firebase\.google\.com/[^\s<>]+", log)
          results_url = urls[-1].rstrip(".,);]") if urls else None
          status = "passed" if os.environ["TESTLAB_STATUS"] == "0" else "failed"
          result = {
              "status": status,
              "gcloud_exit_code": int(os.environ["TESTLAB_STATUS"]),
              "project_id": os.environ["FIREBASE_TEST_LAB_PROJECT_ID"],
              "tested_sha": os.environ["TESTED_SHA"],
              "device": {"model": "MediumPhone.arm", "api": "35",
                         "locale": "en", "orientation": "portrait"},
              "results_url": results_url,
          }
          Path("testlab-results/result.json").write_text(json.dumps(result, indent=2) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"### Firebase Test Lab: {status}\n\n")
              summary.write("MediumPhone.arm / API 35 / en / portrait\n\n")
              if results_url:
                  summary.write(f"[Open Firebase test results]({results_url})\n")
              else:
                  summary.write("No Firebase results URL was emitted; see the CLI log artifact.\n")
          PY
          exit "$testlab_status"

      - name: Upload Test Lab log and result summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-testlab-results-${{ github.run_id }}
          path: testlab-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Test Lab APKs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-testlab-apks-${{ github.run_id }}
          path: |
            build/app/outputs/flutter-apk/app-dev-debug.apk
            build/app/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 14
