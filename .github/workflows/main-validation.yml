name: Main Validation

on:
  push:
    branches:
      - main

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false
      - run: flutter pub get
      - run: flutter analyze

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false
      - run: flutter pub get
      - run: flutter test --coverage
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info -o coverage/html
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: coverage/html
          if-no-files-found: error
          retention-days: 14

  security:
    name: Snyk Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Check Snyk token
        id: snyk-token
        run: |
          if [[ -z "${SNYK_TOKEN}" ]]; then
            echo "SNYK_TOKEN is not set; skipping report-only Snyk scan."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Setup Snyk CLI
        if: steps.snyk-token.outputs.available == 'true'
        uses: snyk/actions/setup@master
        continue-on-error: true
      - name: Run Snyk scan
        if: steps.snyk-token.outputs.available == 'true'
        run: bash .github/scripts/run_snyk_scans.sh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  android-integration:
    name: android-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            flutter build apk --debug --flavor dev --target integration_test/app_smoke_test.dart --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
            flutter test --reporter expanded integration_test/app_smoke_test.dart -d emulator-5554 --flavor dev --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
            (cd android && ./gradlew app:connectedDevDebugAndroidTest -Ptarget=integration_test/app_smoke_test.dart)

  linux-build:
    name: linux-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - run: flutter build linux --release --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14

  macos-build:
    name: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - run: flutter build macos --release --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: build/macos/Build/Products/Release
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: false
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
        shell: bash
      - run: flutter build windows --release --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
        shell: bash
      - name: Upload Windows artifact (non-blocking)
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14
